name: Bootstrap reproducibility package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack curated repository
        run: |
          unzip -o selective-audit-routing-public.zip
          rm selective-audit-routing-public.zip
          rm .github/workflows/bootstrap.yml
      - name: Publish files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish reproducibility package"
          git push
